schema: spec-driven

# 這段 context 會被帶進之後每一個 artifact 的撰寫指示，所以這裡放的是
# 「任何人（或 agent）在提出新 change 之前都必須知道的事」：專案為什麼存在、
# 為什麼這樣設置、哪些規則不能破。細節在 docs/，這裡只放結論與指路。
context: |
  Language: zh-TW
  All artifacts must be written in zh-TW.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 專案是什麼
  Mocking momoshop：以純前端重建 momo 電商的首頁（/）與商品詳情頁（/goods/:goodsId）。
  全程 Mock Data，不呼叫任何真實 API。這是一份評估用的作業，評分重點是系統設計、
  可維護性、tradeoff 判斷與 Agent 協作監督 —— 不是功能完整度或 UI 精緻度。
  README 與 commit history 也是評分的一部分；要以「長期維護者」的角度撰寫。

  ## 為什麼這樣設置
  - 用 2 個頁面的實作，展示一套在 30 個頁面、5 個團隊時仍能運作的結構。
    以目前規模這個結構是偏重的（10 個 lib 約 80 個設定檔）；這是刻意的選擇，
    代價照實寫在 README 的 Tradeoffs 與 docs/adr/0002。
  - Nx 23 + pnpm workspaces + TypeScript project references。1 個薄殼 app + 依
    domain 與職責切分的 libs。選 Nx 是因為依賴方向可以由 lint 強制，而不是靠 review。
  - SPA（React 19 + Vite）而非 Next：mock-only 沒有 SEO 需求、可靜態部署。
    遷移路徑靠「router 只存在於 app」保留（docs/adr/0001）。
  - 不安裝全域 store：兩個頁面都是展示用，盤點後全域 client state 為 0（docs/adr/0003）。
  - 資料走 repository interface + Context 注入：mock 換真實 API 只改 composition root
    （docs/adr/0005）。
  - 首頁由版位資料驅動（config-driven），因為真實網站是 CMS 區塊制（docs/adr/0004）。

  ## 不能破的規則（細節見 openspec/specs/module-boundaries 與 CLAUDE.md）
  - 依賴方向：app → layout / page → feature → ui / data-access → util。feature ✗ feature，
    data-access ✗ data-access；只有 layout 與 page 可以組合多個 feature，兩者同層、互不依賴。
  - react-router 只准出現在 apps/shop；embla 只准出現在 libs/shared/ui。
  - Rule of Two：被 ≥2 個專案使用的東西才能進 shared/*；其餘留在該 lib 私有的
    ui/ 或 model/，不從 index.ts 匯出。
  - shared/ui 不認識 domain model，只宣告自己需要的最小形狀。
  - 不可為了讓 lint 通過而修改 depConstraints；新增 scope 放行前先改 docs/adr/0006。
  - 範圍：詳情頁是展示用，三顆動作按鈕不綁任何行為；搜尋框是展示用；banner 不可點。
    需求沒寫的就不要做。

  ## 規格與文件的分工
  - openspec/specs/   ：系統「現在必須」滿足的行為（已實作、已驗證）。
  - openspec/changes/ ：接下來要做什麼、為什麼、怎麼設計；完成後 archive 併入 specs。
  - docs/architecture.md：結構的敘事。docs/adr/：每個決策的背景、理由、代價、演進觸發條件。
  - docs/agent-workflow.md：Human 與 Agent 的協作紀錄，含糾正與事故。

rules:
  proposal:
    - 明確列出非目標（Non-goals），尤其是「刻意不做」而容易被誤認為未完成的項目。
  specs:
    - 只寫可觀察的行為；不寫函式名稱、元件名稱或套件名稱。
    - 每個 scenario 必須能直接轉成一個自動化測試或一個可重複的手動檢查；流程性的規定不是 scenario。
    - 規格裡聲稱「會被工具擋下」的行為，必須實際驗證過（放入違規樣本確認被擋）才能寫進去。
  design:
    - 每個決策都要寫出放棄的方案與放棄的理由；有對應 ADR 的指向 ADR，不重抄全文。
    - 照實寫代價。以目前規模偏重的選擇要說它偏重。
  tasks:
    - 一個任務群組對應一個 commit；每個任務都要寫明怎麼驗證完成。
    - 有邏輯的任務先寫測試並確認因正確的理由失敗，再實作。
    - 任務若讓某個 lib 出現第一個 spec，要同時移除該 lib 的 passWithNoTests。

operations:
  apply:
    guidance:
      - 驗證關卡使用 --skip-nx-cache 與 --parallel=1；貼出實際輸出，失敗照實說，讀錯誤訊息分辨是程式碼還是環境的問題。
      - 一個 lib 要 import 另一個 lib 時，先在自己的 package.json 宣告 workspace:* 依賴並執行 nx sync，再跑 pnpm verify:boundaries。
      - 完成一個任務立刻把 tasks.md 的 - [ ] 改成 - [x]；偏離計畫的地方記在 docs/agent-workflow.md。
  archive:
    guidance:
      - archive 前確認 pnpm verify:boundaries 為 0 違規，且 openspec validate --strict 通過。
