name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PR 的 nx affected 要比對 git 歷史，所以不能只取最後一個 commit
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 版本來自 package.json 的 packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # lockfile 過期就在這裡失敗，不會帶著不一致的依賴往下跑
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # 依賴規則真的套用到每個專案、依賴圖 0 違規（規則設定錯誤時 lint 會靜默通過，這一步不會）
      - run: pnpm verify:boundaries

      # 商品 fixtures 與素材一致
      - run: pnpm verify:fixtures

      # main：全部都跑。main 的綠燈要代表「整個 repo 是好的」，不是「這個 commit 沒碰到的部分沒人看」
      - if: github.event_name == 'push'
        run: pnpm exec nx run-many -t lint test typecheck build

      # 真的瀏覽器走一次主要路徑（首頁 → 商品卡 → 詳情頁、輪播換頁）。用 runner 內建的 Chrome，不另外下載
      - if: github.event_name == 'push'
        run: pnpm exec nx e2e shop

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/shop/test-output/playwright
          if-no-files-found: ignore
          retention-days: 7

      # PR：只跑被改到的專案（和 PR 的 base 比）
      - if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v4
      - if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t lint test typecheck build

  # Demo 站：GitHub Pages。只在 main 的 verify 通過之後才部署
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 專案頁掛在 /<repo 名稱>/ 底下。build、router 的 basename、index.html 的 <base>、e2e 都讀這個變數；
      # 它也是 Nx 快取 key 的一部分（nx.json 的 sharedGlobals），否則會拿到根路徑版的產物
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx build shop

      # 部署出去的就是這一份：先用真的瀏覽器對它走一次
      - run: pnpm exec nx e2e shop

      # Pages 沒有 SPA 的 fallback：直接開或重新整理 /goods/… 會 404。
      # 404.html 和 index.html 相同，router 會依網址渲染出正確的頁面
      - run: cp apps/shop/dist/index.html apps/shop/dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/shop/dist
      - id: deployment
        uses: actions/deploy-pages@v4
